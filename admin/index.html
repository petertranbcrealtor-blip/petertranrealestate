<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM — Peter Tran Real Estate</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="../css/styles.css">
<style>
  body{ background:var(--paper); }
  table{ width:100%; border-collapse:collapse; background:var(--white); }
  th, td{ text-align:left; padding:12px 14px; border-bottom:1px solid var(--line); font-size:14px; vertical-align:top; }
  th{ font-family:var(--font-mono); font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--slate); }
  select.status{ font-family:var(--font-body); font-size:13px; padding:4px 8px; border-radius:3px; border:1px solid var(--line); }
  textarea.notes-input{
    width:100%; min-width:180px; font-family:var(--font-body); font-size:13px;
    padding:6px 8px; border:1px solid var(--line); border-radius:3px; resize:vertical; min-height:40px;
  }
  #loginBox{ max-width:420px; margin:120px auto; }
  .pill{ font-family:var(--font-mono); font-size:11px; padding:3px 8px; border-radius:10px; background:var(--fir-tint); color:var(--fir); }
  .toolbar{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:20px; }
  .toolbar input[type="text"], .toolbar select{
    padding:10px 12px; font-family:var(--font-body); font-size:14px;
    border:1px solid var(--line); border-radius:3px; background:var(--white);
  }
  .toolbar input[type="text"]{ min-width:220px; flex:1; }
  .save-indicator{ font-size:11px; color:var(--fir); opacity:0; transition:opacity .3s ease; margin-top:4px; }
  .save-indicator.show{ opacity:1; }
</style>
</head>
<body>
<div class="container" style="padding-top:32px; padding-bottom:60px;">
  <div id="loginBox" class="card">
    <h2 style="font-size:20px;">CRM Login</h2>
    <p style="font-size:14px;">Enter your admin token (set as <span class="mono">ADMIN_TOKEN</span> in your Vercel project settings).</p>
    <div class="field"><input type="password" id="tokenInput" placeholder="Admin token"></div>
    <button class="btn btn-primary" id="loginBtn" style="width:100%; justify-content:center;">Enter</button>
    <p class="form-status err" id="loginErr"></p>
  </div>

  <div id="dashboard" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:12px;">
      <h1 style="font-size:26px; margin:0;">Leads</h1>
      <div style="display:flex; gap:10px; align-items:center;">
        <span class="pill" id="leadCount">0 leads</span>
        <button class="btn btn-outline" id="exportBtn">Export CSV</button>
        <button class="btn btn-outline" id="refreshBtn">Refresh</button>
        <button class="btn btn-outline" id="logoutBtn">Log out</button>
      </div>
    </div>

    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="Search name, email, phone, or message…">
      <select id="statusFilter">
        <option value="">All statuses</option>
        <option value="new">New</option>
        <option value="contacted">Contacted</option>
        <option value="qualified">Qualified</option>
        <option value="client">Client</option>
        <option value="closed">Closed</option>
        <option value="lost">Lost</option>
      </select>
      <select id="sourceFilter">
        <option value="">All sources</option>
      </select>
    </div>

    <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>Received</th><th>Name</th><th>Contact</th><th>Source</th><th>Details</th><th>Message</th><th>Status</th><th>Notes</th>
          </tr>
        </thead>
        <tbody id="leadsBody"></tbody>
      </table>
    </div>
    <p class="form-status" id="loadErr"></p>
    <p class="form-note" id="emptyState" style="display:none; margin-top:20px;">No leads match your search/filter.</p>
  </div>
</div>

<script>
(function(){
  const loginBox = document.getElementById('loginBox');
  const dashboard = document.getElementById('dashboard');
  const tokenInput = document.getElementById('tokenInput');
  const loginBtn = document.getElementById('loginBtn');
  const loginErr = document.getElementById('loginErr');
  const leadsBody = document.getElementById('leadsBody');
  const leadCount = document.getElementById('leadCount');
  const loadErr = document.getElementById('loadErr');
  const emptyState = document.getElementById('emptyState');
  const searchInput = document.getElementById('searchInput');
  const statusFilter = document.getElementById('statusFilter');
  const sourceFilter = document.getElementById('sourceFilter');
  const exportBtn = document.getElementById('exportBtn');

  let allLeads = [];

  function getToken(){ return sessionStorage.getItem('ptre_admin_token'); }
  function setToken(t){ sessionStorage.setItem('ptre_admin_token', t); }
  function clearToken(){ sessionStorage.removeItem('ptre_admin_token'); }

  async function loadLeads(){
    loadErr.className = 'form-status';
    try {
      const res = await fetch('/api/leads', { headers: { Authorization: 'Bearer ' + getToken() } });
      if(res.status === 401){ showLogin('Token rejected — check ADMIN_TOKEN in Vercel matches what you entered.'); return; }
      if(!res.ok) throw new Error('Load failed');
      const data = await res.json();
      allLeads = data.leads || [];
      populateSourceFilter();
      applyFilters();
    } catch(e){
      loadErr.textContent = 'Could not load leads. Check your connection and try refresh.';
      loadErr.className = 'form-status show err';
    }
  }

  function populateSourceFilter(){
    const current = sourceFilter.value;
    const sources = Array.from(new Set(allLeads.map(l => l.source).filter(Boolean))).sort();
    sourceFilter.innerHTML = '<option value="">All sources</option>' +
      sources.map(s => `<option value="${s}">${s}</option>`).join('');
    sourceFilter.value = current;
  }

  function applyFilters(){
    const q = searchInput.value.trim().toLowerCase();
    const statusVal = statusFilter.value;
    const sourceVal = sourceFilter.value;

    const filtered = allLeads.filter(l => {
      if(statusVal && (l.status || 'new') !== statusVal) return false;
      if(sourceVal && l.source !== sourceVal) return false;
      if(q){
        const haystack = [l.name, l.email, l.phone, l.message].filter(Boolean).join(' ').toLowerCase();
        if(!haystack.includes(q)) return false;
      }
      return true;
    });
    renderLeads(filtered);
  }

  function renderLeads(leads){
    leadCount.textContent = leads.length + ' lead' + (leads.length === 1 ? '' : 's') +
      (leads.length !== allLeads.length ? ` (of ${allLeads.length})` : '');
    leadsBody.innerHTML = '';
    emptyState.style.display = leads.length ? 'none' : 'block';

    leads.forEach(function(l){
      const tr = document.createElement('tr');
      const details = l.details ? Object.entries(l.details).map(function(kv){ return kv[0] + ': ' + kv[1]; }).join('<br>') : '';
      tr.innerHTML =
        '<td class="mono">' + new Date(l.created_at).toLocaleString() + '</td>' +
        '<td>' + escapeHtml(l.name || '') + '</td>' +
        '<td>' + escapeHtml(l.email || '') + (l.phone ? '<br>' + escapeHtml(l.phone) : '') + '</td>' +
        '<td>' + escapeHtml(l.source || '') + '</td>' +
        '<td style="font-size:12.5px; color:var(--slate);">' + details + '</td>' +
        '<td style="max-width:220px;">' + escapeHtml(l.message || '') + '</td>' +
        '<td></td>' +
        '<td style="min-width:200px;"></td>';

      // Status dropdown
      const statusTd = tr.children[6];
      const select = document.createElement('select');
      select.className = 'status';
      ['new','contacted','qualified','client','closed','lost'].forEach(function(s){
        const opt = document.createElement('option');
        opt.value = s; opt.textContent = s;
        if((l.status || 'new') === s) opt.selected = true;
        select.appendChild(opt);
      });
      select.addEventListener('change', async function(){
        l.status = select.value;
        try {
          await fetch('/api/lead-status', {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + getToken() },
            body: JSON.stringify({ id: l.id, status: select.value })
          });
        } catch(e){ console.error('Status update failed', e); }
      });
      statusTd.appendChild(select);

      // Notes textarea, saved on blur (click away) with a small debounce-free save
      const notesTd = tr.children[7];
      const notesArea = document.createElement('textarea');
      notesArea.className = 'notes-input';
      notesArea.placeholder = 'Add a note…';
      notesArea.value = l.notes || '';
      const saveIndicator = document.createElement('div');
      saveIndicator.className = 'save-indicator';
      saveIndicator.textContent = 'Saved';

      let saveTimeout;
      async function saveNotes(){
        try {
          await fetch('/api/lead-status', {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + getToken() },
            body: JSON.stringify({ id: l.id, notes: notesArea.value })
          });
          l.notes = notesArea.value;
          saveIndicator.classList.add('show');
          setTimeout(() => saveIndicator.classList.remove('show'), 1500);
        } catch(e){ console.error('Notes save failed', e); }
      }
      notesArea.addEventListener('blur', saveNotes);
      notesArea.addEventListener('keydown', function(e){
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(saveNotes, 1200);
      });

      notesTd.appendChild(notesArea);
      notesTd.appendChild(saveIndicator);
      leadsBody.appendChild(tr);
    });
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function exportCsv(){
    const rows = [['Received','Name','Email','Phone','Source','Status','Message','Notes']];
    const q = searchInput.value.trim().toLowerCase();
    const statusVal = statusFilter.value;
    const sourceVal = sourceFilter.value;
    const leads = allLeads.filter(l => {
      if(statusVal && (l.status || 'new') !== statusVal) return false;
      if(sourceVal && l.source !== sourceVal) return false;
      if(q){
        const haystack = [l.name, l.email, l.phone, l.message].filter(Boolean).join(' ').toLowerCase();
        if(!haystack.includes(q)) return false;
      }
      return true;
    });
    leads.forEach(l => {
      rows.push([
        new Date(l.created_at).toLocaleString(),
        l.name || '', l.email || '', l.phone || '',
        l.source || '', l.status || 'new', l.message || '', l.notes || ''
      ]);
    });
    const csv = rows.map(row =>
      row.map(cell => '"' + String(cell).replace(/"/g, '""') + '"').join(',')
    ).join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'leads-' + new Date().toISOString().slice(0,10) + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function showDashboard(){
    loginBox.style.display = 'none';
    dashboard.style.display = 'block';
    loadLeads();
  }
  function showLogin(err){
    dashboard.style.display = 'none';
    loginBox.style.display = 'block';
    clearToken();
    if(err){ loginErr.textContent = err; loginErr.className = 'form-status show err'; }
  }

  loginBtn.addEventListener('click', function(){
    const t = tokenInput.value.trim();
    if(!t) return;
    setToken(t);
    showDashboard();
  });
  document.getElementById('logoutBtn')?.addEventListener('click', showLogin);
  document.getElementById('refreshBtn')?.addEventListener('click', loadLeads);
  exportBtn.addEventListener('click', exportCsv);
  searchInput.addEventListener('input', applyFilters);
  statusFilter.addEventListener('change', applyFilters);
  sourceFilter.addEventListener('change', applyFilters);

  if(getToken()) showDashboard();
})();
</script>
</body>
</html>
