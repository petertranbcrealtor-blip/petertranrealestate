<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM — Peter Tran Real Estate</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="../css/styles.css">
<style>
  body{ background:var(--paper); }
  table{ width:100%; border-collapse:collapse; background:var(--white); }
  th, td{ text-align:left; padding:12px 14px; border-bottom:1px solid var(--line); font-size:14px; vertical-align:top; }
  th{ font-family:var(--font-mono); font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--slate); }
  select.status{ font-family:var(--font-body); font-size:13px; padding:4px 8px; border-radius:3px; border:1px solid var(--line); }
  #loginBox{ max-width:420px; margin:120px auto; }
  .pill{ font-family:var(--font-mono); font-size:11px; padding:3px 8px; border-radius:10px; background:var(--fir-tint); color:var(--fir); }
</style>
</head>
<body>
<div class="container" style="padding-top:32px; padding-bottom:60px;">
  <div id="loginBox" class="card">
    <h2 style="font-size:20px;">CRM Login</h2>
    <p style="font-size:14px;">Enter your admin token (set as <span class="mono">ADMIN_TOKEN</span> in your Vercel project settings).</p>
    <div class="field"><input type="password" id="tokenInput" placeholder="Admin token"></div>
    <button class="btn btn-primary" id="loginBtn" style="width:100%; justify-content:center;">Enter</button>
    <p class="form-status err" id="loginErr"></p>
  </div>

  <div id="dashboard" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; flex-wrap:wrap; gap:12px;">
      <h1 style="font-size:26px; margin:0;">Leads</h1>
      <div style="display:flex; gap:10px; align-items:center;">
        <span class="pill" id="leadCount">0 leads</span>
        <button class="btn btn-outline" id="refreshBtn">Refresh</button>
        <button class="btn btn-outline" id="logoutBtn">Log out</button>
      </div>
    </div>
    <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>Received</th><th>Name</th><th>Contact</th><th>Source</th><th>Details</th><th>Message</th><th>Status</th>
          </tr>
        </thead>
        <tbody id="leadsBody"></tbody>
      </table>
    </div>
    <p class="form-status" id="loadErr"></p>
  </div>
</div>

<script>
(function(){
  const loginBox = document.getElementById('loginBox');
  const dashboard = document.getElementById('dashboard');
  const tokenInput = document.getElementById('tokenInput');
  const loginBtn = document.getElementById('loginBtn');
  const loginErr = document.getElementById('loginErr');
  const leadsBody = document.getElementById('leadsBody');
  const leadCount = document.getElementById('leadCount');
  const loadErr = document.getElementById('loadErr');

  function getToken(){ return sessionStorage.getItem('ptre_admin_token'); }
  function setToken(t){ sessionStorage.setItem('ptre_admin_token', t); }
  function clearToken(){ sessionStorage.removeItem('ptre_admin_token'); }

  async function loadLeads(){
    loadErr.className = 'form-status';
    try {
      const res = await fetch('/api/leads', { headers: { Authorization: 'Bearer ' + getToken() } });
      if(res.status === 401){ showLogin('Token rejected — check ADMIN_TOKEN in Vercel matches what you entered.'); return; }
      if(!res.ok) throw new Error('Load failed');
      const data = await res.json();
      renderLeads(data.leads || []);
    } catch(e){
      loadErr.textContent = 'Could not load leads. Check your connection and try refresh.';
      loadErr.className = 'form-status show err';
    }
  }

  function renderLeads(leads){
    leadCount.textContent = leads.length + ' lead' + (leads.length === 1 ? '' : 's');
    leadsBody.innerHTML = '';
    leads.forEach(function(l){
      const tr = document.createElement('tr');
      const details = l.details ? Object.entries(l.details).map(function(kv){ return kv[0] + ': ' + kv[1]; }).join('<br>') : '';
      tr.innerHTML =
        '<td class="mono">' + new Date(l.created_at).toLocaleString() + '</td>' +
        '<td>' + escapeHtml(l.name || '') + '</td>' +
        '<td>' + escapeHtml(l.email || '') + (l.phone ? '<br>' + escapeHtml(l.phone) : '') + '</td>' +
        '<td>' + escapeHtml(l.source || '') + '</td>' +
        '<td style="font-size:12.5px; color:var(--slate);">' + details + '</td>' +
        '<td style="max-width:260px;">' + escapeHtml(l.message || '') + '</td>' +
        '<td></td>';
      const statusTd = tr.lastElementChild;
      const select = document.createElement('select');
      select.className = 'status';
      ['new','contacted','qualified','client','closed','lost'].forEach(function(s){
        const opt = document.createElement('option');
        opt.value = s; opt.textContent = s;
        if(l.status === s) opt.selected = true;
        select.appendChild(opt);
      });
      select.addEventListener('change', async function(){
        try {
          await fetch('/api/lead-status', {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + getToken() },
            body: JSON.stringify({ id: l.id, status: select.value })
          });
        } catch(e){ console.error('Status update failed', e); }
      });
      statusTd.appendChild(select);
      leadsBody.appendChild(tr);
    });
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function showDashboard(){
    loginBox.style.display = 'none';
    dashboard.style.display = 'block';
    loadLeads();
  }
  function showLogin(err){
    dashboard.style.display = 'none';
    loginBox.style.display = 'block';
    clearToken();
    if(err){ loginErr.textContent = err; loginErr.className = 'form-status show err'; }
  }

  loginBtn.addEventListener('click', function(){
    const t = tokenInput.value.trim();
    if(!t) return;
    setToken(t);
    showDashboard();
  });
  document.getElementById('logoutBtn')?.addEventListener('click', showLogin);
  document.getElementById('refreshBtn')?.addEventListener('click', loadLeads);

  if(getToken()) showDashboard();
})();
</script>
</body>
</html>
